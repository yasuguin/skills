name: Check
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  frontmatter:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-frontmatter
  changeset:
    name: changeset がある
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CHANGELOG.md を直接直す PR（version PR と初版）は版を自分で上げるので、changeset を求めない。
      - run: |
          if git diff --name-only origin/main...HEAD | grep -qx CHANGELOG.md; then exit 0; fi
          pnpm changeset status --since=origin/main
